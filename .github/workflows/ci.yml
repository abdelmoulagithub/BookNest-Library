name: BookNest CI

on: [push]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: library-frontend/package-lock.json

      - name: Install Front
        working-directory: ./library-frontend
        run: npm ci

      - name: Build Front
        working-directory: ./library-frontend
        env:
          CI: false
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build Back
        working-directory: ./library-management
        run: mvn -B compile -DskipTests