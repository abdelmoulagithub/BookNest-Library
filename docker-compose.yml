version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booknest_db
      MYSQL_USER: booknest
      MYSQL_PASSWORD: booknest123
    ports: ["3306:3306"]
    volumes: [db_data:/var/lib/mysql]

  backend:
    build: ./library-management
    ports: ["8080:8080"]
    depends_on: [db]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/booknest_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: booknest
      SPRING_DATASOURCE_PASSWORD: booknest123

  frontend:
    build: ./library-frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  db_data:
